name: 'entropy_shared_seeds'
version: '0.1.0'
config-version: 2

seed-paths: ["seeds"]

seeds:
  entropy_shared_seeds:
    +quote_columns: true
    dim_proposals:
      +column_types:
        dao: varchar(50)
        number: int
        id: varchar(100)
        title: varchar(500)
        category: varchar(100)
        theme: varchar(100)
    dim_dex_factory_addresses:
      +column_types:
        protocol: varchar
        version: varchar
        blockchain: varchar
        address: varchar
        min_block_number: bigint
    dim_coin_id_overrides:
      +column_types:
        blockchain: varchar
        address: varchar
        symbol: varchar
        coin_id: varchar
        replaces_coin_id: varchar
        note: varchar
